<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>try { const theme = localStorage.getItem('quizzine-theme'); if (theme) document.documentElement.dataset.theme = theme; } catch {}</script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WMMW5VG9YV"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WMMW5VG9YV');
    </script>
    <meta name="robots" content="noindex" />
    <title>Upload a quiz — Quizzine</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260818-dark" />
  </head>
  <body>
    <button class="theme-toggle" type="button" role="switch" aria-checked="false"><span class="theme-toggle-track-icon" aria-hidden="true">☀</span><span class="theme-toggle-thumb"><span class="theme-toggle-icon" aria-hidden="true">☾</span></span><span class="theme-toggle-label">Dark mode</span></button>
    <main class="upload-shell">
      <a class="back" href="/">← Back to Quizzine</a>
      <p class="eyebrow">QUIZ CLUB · VSSUT BURLA</p>
      <h1>Share a quiz.</h1>
      <p class="intro">Upload the original PowerPoint and credit the person who made it. It will appear in the library immediately.</p>
      <form id="upload-form" class="upload-form">
        <label>Presentation title<input name="title" required maxlength="120" /></label>
        <label>Quizmaster name<input name="quizmaster" required maxlength="100" /></label>
        <label>Year<input name="year" required inputmode="numeric" pattern="[0-9]{4}" maxlength="4" placeholder="2026" /></label>
        <label>Social media handle <span>(optional)</span><input name="handle" maxlength="100" placeholder="@quizmaster" /></label>
        <label>Topic<input name="topic" maxlength="60" value="Mixed bag" /></label>
        <label>PowerPoint deck<input name="deck" type="file" accept=".ppt,.pptx,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation" required /></label>
        <p class="upload-help">PPT and PPTX only, up to 50 MB. Please upload only quiz decks you are allowed to share.</p>
        <button type="submit" class="upload-button">Upload</button>
        <div id="upload-progress" class="upload-progress" hidden aria-hidden="true">
          <div class="upload-progress-track"><div id="upload-progress-bar" class="upload-progress-bar"></div></div>
          <span id="upload-progress-label">Preparing upload…</span>
        </div>
        <p id="upload-status" class="upload-status" aria-live="polite"></p>
      </form>
    </main>
    <script src="theme.js?v=20260818-theme-toggle"></script>
    <script src="upload.js?v=20260818-upload-r4"></script>
  </body>
</html>
