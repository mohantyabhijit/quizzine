<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Read and play a Quizzine quiz presentation." />
    <title>Quiz viewer — Quizzine</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260818-pdf-renderer" />
  </head>
  <body class="viewer-page">
    <main class="viewer-shell">
      <a class="back" href="index.html">← All quizzes</a>
      <div class="viewer-heading">
        <div><p id="viewer-topic" class="eyebrow"></p><h1 id="viewer-title">Quiz viewer</h1></div>
        <a id="download" class="download" download>Download presentation ↓</a>
      </div>
      <div id="deck-frame" class="deck-frame" aria-busy="true">
        <canvas id="deck" aria-label="Quiz presentation viewer"></canvas>
        <p id="deck-loading" class="deck-loading">Loading presentation…</p>
      </div>
      <nav class="deck-navigation" aria-label="Presentation controls">
        <button id="previous-slide" type="button">← Previous slide</button>
        <span id="slide-status" aria-live="polite">Slide 1</span>
        <button id="next-slide" type="button">Next slide →</button>
      </nav>
      <p class="viewer-note">Swipe or use the slide controls to play. If the viewer is unavailable on your device, download the deck instead.</p>
    </main>
  <script src="quizzes.js?v=20260817-r2-fix"></script>
  <script type="module" src="viewer.js?v=20260818-pdf-renderer"></script>
  </body>
</html>
