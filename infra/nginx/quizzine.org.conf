server {
    listen 80;
    listen [::]:80;
    server_name quizzine.org www.quizzine.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/quizzine;
    }

    location / {
        return 301 https://quizzine.org$request_uri;
    }
}

# Unproxied, read-only source used by the R2 refresh Worker.
server {
    listen 80;
    listen [::]:80;
    server_name origin.quizzine.org;

    root /var/www/quizzine;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quizzine.org www.quizzine.org origin.quizzine.org;

    root /var/www/quizzine;
    index index.html;

    ssl_certificate /etc/nginx/ssl/quizzine.origin.pem;
    ssl_certificate_key /etc/nginx/ssl/quizzine.origin.key;

    location / {
        try_files $uri $uri/ =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 50m;
    }

    location ~* \.(?:css|js|pdf|pptx)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
