  <body>
    <button class="theme-toggle" type="button" role="switch" aria-checked="false"><span class="theme-toggle-track-icon" aria-hidden="true">☀</span><span class="theme-toggle-thumb"><span class="theme-toggle-icon" aria-hidden="true">☾</span></span><span class="theme-toggle-label">Dark mode</span></button>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">QUIZ CLUB · VSSUT BURLA</p>
        <h1 id="page-title">Quizzine</h1>
        <p class="intro">A growing library of quizzes for curious people. Pick a deck, gather a team, and play.</p>
        <label class="search" for="quiz-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="quiz-search" type="search" autocomplete="off" placeholder="Search quizzes: cinema, business, India…" aria-describedby="result-count" />
          <kbd>⌘ K</kbd>
        </label>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </section>

      <section aria-label="Quiz library" class="library">
        <div class="filters" id="filters" aria-label="Filter by topic"></div>
        <div id="quiz-grid" class="quiz-grid"></div>
        <p id="empty-state" class="empty" hidden>No quizzes match that search. Try a different term.</p>
      </section>
    </main>
    <footer>Built for quiz nights, classrooms, and friendly arguments.</footer>
  <script>
    (() => {
      const toggle = document.querySelector('.theme-toggle');
      const media = matchMedia('(prefers-color-scheme: dark)');
      const theme = () => document.documentElement.dataset.theme || (media.matches ? 'dark' : 'light');
      const update = () => { const dark = theme() === 'dark'; toggle.setAttribute('aria-checked', String(dark)); toggle.setAttribute('aria-label', `Switch to ${dark ? 'light' : 'dark'} mode`); toggle.querySelector('.theme-toggle-label').textContent = dark ? 'Light mode' : 'Dark mode'; };
      toggle.addEventListener('click', () => { const next = theme() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = next; try { localStorage.setItem('quizzine-theme', next); } catch {} update(); });
      media.addEventListener('change', () => { if (!document.documentElement.dataset.theme) update(); });
      update();
    })();
  </script>
  <script src="quizzes.js?v=20260818-upload"></script>
  <script src="app.js?v=20260818-upload-r3"></script>
  </body>
</html>
