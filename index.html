  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <p class="eyebrow">QUIZ CLUB · VSSUT BURLA</p>
        <h1 id="page-title">Quizzine</h1>
        <p class="intro">A growing library of quizzes for curious people. Pick a deck, gather a team, and play.</p>
        <label class="search" for="quiz-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="quiz-search" type="search" autocomplete="off" placeholder="Search quizzes: cinema, business, India…" aria-describedby="result-count" />
          <kbd>⌘ K</kbd>
        </label>
        <p id="result-count" class="result-count" aria-live="polite"></p>
      </section>

      <section aria-label="Quiz library" class="library">
        <div class="filters" id="filters" aria-label="Filter by topic"></div>
        <div id="quiz-grid" class="quiz-grid"></div>
        <p id="empty-state" class="empty" hidden>No quizzes match that search. Try a different term.</p>
      </section>
    </main>
    <footer>Built for quiz nights, classrooms, and friendly arguments.</footer>
