name: Deploy Quizzine

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quizzine-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure the deploy connection
        env:
          QUIZZINE_VPS_HOST: ${{ secrets.QUIZZINE_VPS_HOST }}
          QUIZZINE_VPS_SSH_KEY: ${{ secrets.QUIZZINE_VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$QUIZZINE_VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$QUIZZINE_VPS_HOST" >> ~/.ssh/known_hosts
      - name: Upload and activate the release
        env:
          QUIZZINE_VPS_HOST: ${{ secrets.QUIZZINE_VPS_HOST }}
          QUIZZINE_VPS_USER: ${{ secrets.QUIZZINE_VPS_USER }}
          QUIZZINE_VPS_PATH: ${{ secrets.QUIZZINE_VPS_PATH }}
          QUIZZINE_VPS_DEPLOY_COMMAND: ${{ secrets.QUIZZINE_VPS_DEPLOY_COMMAND }}
          QUIZZINE_UPLOAD_TOKEN: ${{ secrets.QUIZZINE_UPLOAD_TOKEN }}
          QUIZZINE_STORAGE_KEY: ${{ secrets.QUIZZINE_STORAGE_KEY }}
        run: |
          go build -o quizzine-api ./cmd/quizzine-api
          rsync -az --delete --exclude uploads/ index.html styles.css app.js quizzes.js viewer.html viewer.js upload.html upload.js quizzine-api public infra scripts "$QUIZZINE_VPS_USER@$QUIZZINE_VPS_HOST:$QUIZZINE_VPS_PATH/"
          ssh "$QUIZZINE_VPS_USER@$QUIZZINE_VPS_HOST" "bash '$QUIZZINE_VPS_PATH/scripts/deploy-server.sh' '$QUIZZINE_VPS_PATH' '$QUIZZINE_UPLOAD_TOKEN' '$QUIZZINE_STORAGE_KEY'"
          ssh "$QUIZZINE_VPS_USER@$QUIZZINE_VPS_HOST" "$QUIZZINE_VPS_DEPLOY_COMMAND"
